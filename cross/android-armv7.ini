# meson CROSS file: Android armeabi-v7a (32-bit ARM) via the NDK's per-API clang wrappers.
# NDK bin (toolchains/llvm/prebuilt/<host>/bin) must be in PATH (setup_android_env adds it).
# The wrapper name carries the API suffix (NDK r28 has no plain armv7a-linux-androideabi);
# pinned to NDK_DEFAULT_API=24 (a valid minSdk for 32-bit ABIs in NDK r24+).
# The clang wrapper passes --sysroot itself; do not override.
[binaries]
c = 'armv7a-linux-androideabi24-clang'
cpp = 'armv7a-linux-androideabi24-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
nm = 'llvm-nm'
ranlib = 'llvm-ranlib'
pkg-config = 'pkg-config'

[host_machine]
system = 'android'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'

[built-in options]
c_args = ['-ffunction-sections', '-fdata-sections', '-fPIC']
c_link_args = ['-Wl,--gc-sections', '-Wl,-u,JNI_OnLoad', '-Wl,-u,JNI_OnUnload', '-Wl,-z,max-page-size=16384', '-Wl,-z,common-page-size=16384']
cpp_args = ['-ffunction-sections', '-fdata-sections', '-fPIC']