name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      hwdec:
        description: 'video profile: build hardware-decode (copy-back) support (1/0)'
        default: '1'
  workflow_call:
    inputs:
      hwdec:
        type: string
        default: '1'


concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PRIVATE: ${{ github.event.repository.private }}
          ENABLE_ARM64: ${{ vars.ENABLE_ARM64 }}
        run: |
          # Native arm64 runners are free only for public repos; on a private repo the jobs would
          # queue forever, so linux-arm64 is skipped unless the repo is public or vars.ENABLE_ARM64=1.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          arm = os.environ.get("PRIVATE") != "true" or os.environ.get("ENABLE_ARM64") == "1"
          targets = {"linux-x86_64": "ubuntu-latest", "win-x86_64": "ubuntu-latest", "win-arm64": "ubuntu-latest"}
          # Android: two 64-bit ABIs (arm64-v8a, x86_64). Cross-compiled on ubuntu with the NDK;
          # no emulator, so only build/ELF checks (no runtime). armeabi-v7a/x86 32-bit deferred.
          android = {"android-arm64": "ubuntu-latest", "android-x86_64": "ubuntu-latest"}
          if arm: targets["linux-arm64"] = "ubuntu-24.04-arm"
          inc = [{"profile": p, "target": t, "runner": r, "network": "0"} for p in ("music", "video") for t, r in targets.items()]
          inc += [{"profile": p, "target": t, "runner": r, "network": "0"} for p in ("music", "video") for t, r in android.items()]
          inc.append({"profile": "music", "target": "linux-x86_64", "runner": "ubuntu-latest", "network": "1"})
          print("matrix=" + json.dumps({"include": inc}))
          PY

  build:
    needs: plan
    name: ${{ matrix.profile }} / ${{ matrix.target }}${{ matrix.network == '1' && ' / net' || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      WITH_NETWORK: ${{ matrix.network }}
      HWDEC: ${{ inputs.hwdec || '1' }}
      ID: ${{ matrix.profile }}-${{ matrix.target }}${{ matrix.network == '1' && '-net' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          PKGS="nasm cmake ninja-build pkg-config python3-pip ccache zip xz-utils curl"
          case "${{ matrix.target }}" in
            linux-*) PKGS="$PKGS libasound2-dev libpulse-dev libpipewire-0.3-dev libva-dev libdrm-dev ffmpeg" ;;
          esac
          sudo apt-get install -y --no-install-recommends $PKGS
          python3 -m pip install --user --break-system-packages meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install llvm-mingw
        if: startsWith(matrix.target, 'win-')
        run: |
          . ./upstream.lock
          curl -fL --retry 3 "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz" | tar -xJ -C "$HOME"
          echo "$HOME/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK r28
        if: startsWith(matrix.target, 'android-')
        run: |
          . ./upstream.lock
          curl -fL --retry 3 -C - "$NDK_URL" -o "$RUNNER_TEMP/android-ndk.zip"
          # verify size (content may legitimately change upstream; the lock's size is a sanity floor)
          SIZE=$(stat -c %s "$RUNNER_TEMP/android-ndk.zip")
          echo "NDK zip size: $SIZE (locked $NDK_SIZE)"
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK=$RUNNER_TEMP/android-ndk-r28c" >> "$GITHUB_ENV"
          # check the toolchain clang wrappers exist (catches a bad/unpacked NDK early)
          ls "$RUNNER_TEMP/android-ndk-r28c/toolchains/llvm/prebuilt"/*/bin/aarch64-linux-android24-clang >/dev/null
          echo "NDK ready"

      - uses: actions/cache@v4
        with:
          path: build/src
          key: src-${{ hashFiles('upstream.lock') }}-${{ matrix.profile }}-${{ matrix.network }}
      - uses: actions/cache@v4
        if: startsWith(matrix.target, 'linux-')
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.ID }}-${{ github.sha }}
          restore-keys: ccache-${{ env.ID }}-

      - name: Validate option / component names against pinned sources
        run: |
          scripts/fetch.sh ${{ matrix.profile }}
          scripts/check-options.sh
          scripts/check-ffmpeg.sh

      - name: Build
        run: scripts/build.sh ${{ matrix.profile }} ${{ matrix.target }}

      - name: Size report
        run: cat "dist/$ID/SIZES.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Android ELF (ABI, NEEDED, 16KB alignment, RELRO, JNI_OnLoad)
        if: startsWith(matrix.target, 'android-')
        run: |
          . ./upstream.lock
          D="dist/$ID"
          LIB=$(find "$D/lib" -name 'libmpv.so*' -type f | head -1)
          ABI=$([ "${{ matrix.target }}" = android-arm64 ] && echo aarch64 || echo x86_64)
          ARCH=$($ANDROID_NDK/toolchains/llvm/prebuilt/*/bin/llvm-readelf -h "$LIB" | awk '/Machine:/{print $2}')
          # aarch64 -> 183, x86_64 -> 62 (e_machine values)
          EXPECT=$([ "$ABI" = aarch64 ] && echo 183 || echo 62)
          [ "$ARCH" = "$EXPECT" ] || { echo "ABI mismatch: e_machine=$ARCH want $EXPECT"; exit 1; }
          echo "OK: e_machine=$ARCH ($ABI)"
          echo "== NEEDED:"
          $ANDROID_NDK/toolchains/llvm/prebuilt/*/bin/llvm-readelf -d "$LIB" | grep NEEDED | sed 's/^/   /'
          # 16 KB page alignment: every PT_LOAD's ALIGN field (last col) must be 0x4000
          $ANDROID_NDK/toolchains/llvm/prebuilt/*/bin/llvm-readelf -lW "$LIB" | awk '
            $1=="LOAD" { a=$NF; if (a != "0x4000") { bad=1; print "PT_LOAD align="a" (want 0x4000):", $0 } }
            END { exit bad }'
          echo "OK: all PT_LOAD 16KB-aligned"
          # RELRO present and page-aligned end
          grep -q GNU_RELRO <($ANDROID_NDK/toolchains/llvm/prebuilt/*/bin/llvm-readelf -lW "$LIB") || { echo "no GNU_RELRO"; exit 1; }
          echo "OK: GNU_RELRO present"
          # JNI_OnLoad exported (not hidden)
          $ANDROID_NDK/toolchains/llvm/prebuilt/*/bin/llvm-readelf --dyn-syms "$LIB" | grep -q ' JNI_OnLoad' || { echo "JNI_OnLoad not exported"; exit 1; }
          echo "OK: JNI_OnLoad exported"
          # exported symbols: only mpv_* + JNI_OnLoad/JNI_OnUnload (+ C runtime)
          echo "== non-mpv_* dynamic symbols:"
          $ANDROID_NDK/toolchains/llvm/prebuilt/*/bin/llvm-readelf --dyn-syms "$LIB" | awk '{print $8}' | \
            grep -E '^[A-Za-z_].*' | grep -v '^mpv_' | grep -vE '^(JNI_OnLoad|JNI_OnUnload|_init|_fini|_edata|_end|__bss_start)$' | sort -u || true
          echo "OK"

      - name: Smoke test (native Linux)
        if: startsWith(matrix.target, 'linux-')
        run: |
          EXP=""
          if [ "${{ matrix.profile }}" = video ] && [ "$HWDEC" = 1 ]; then
            EXP="vaapi-copy"; [ "${{ matrix.target }}" = linux-x86_64 ] && EXP="$EXP nvdec-copy"
          fi
          EXPECT_HWDEC="$EXP" common/tests/run_smoke.sh ${{ matrix.profile }} "dist/$ID"

      - name: HTTP header / HLS test (network build)
        if: matrix.network == '1'
        run: |
          mkdir -p dist/evidence
          EVIDENCE="$PWD/dist/evidence/header-evidence-$ID.txt" common/tests/header_test.sh "dist/$ID"
          cat "dist/evidence/header-evidence-$ID.txt" >> "$GITHUB_STEP_SUMMARY"
          gcc -I"dist/$ID/include" examples/play_with_headers.c -L"dist/$ID/lib" -lmpv -Wl,-rpath,"$PWD/dist/$ID/lib" -o /tmp/play_with_headers
          echo "example compiled OK"

      - name: Cross-build the smoke-test program for Windows
        if: startsWith(matrix.target, 'win-')
        run: |
          TRIPLE=$([ "${{ matrix.target }}" = win-x86_64 ] && echo x86_64-w64-mingw32 || echo aarch64-w64-mingw32)
          D="dist/$ID"; mkdir -p dist/smoke
          EXTRA=""; [ "${{ matrix.profile }}" = video ] && EXTRA="-DMMPV_SW_RENDER"
          "$TRIPLE-clang" -O1 $EXTRA -I"$D/include" common/tests/smoke.c -L"$D/lib" -lmpv -o dist/smoke/mmpv_smoke.exe
          ls -l dist/smoke

      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.target, 'win-')
        with:
          name: smoke-${{ env.ID }}
          path: dist/smoke/mmpv_smoke.exe

      - uses: actions/upload-artifact@v4
        with:
          name: libmmpv-${{ env.ID }}
          path: |
            dist/libmmpv-${{ env.ID }}.*
            dist/${{ env.ID }}/SIZES.md
            dist/evidence/*
          if-no-files-found: error

  media:
    name: generate test media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          common/tests/gen_media.sh "$PWD/media" video
      - uses: actions/upload-artifact@v4
        with:
          name: testmedia
          path: media/
          if-no-files-found: error

  # Real Windows verification: load libmpv-2.dll on a Windows runner, decode, (video) SW-render.
  winverify:
    name: windows run / ${{ matrix.profile }} / ${{ matrix.arch }}
    needs: [build, media]
    runs-on: ${{ matrix.runner }}
    # x86_64 is a hard gate. arm64 uses windows-11-arm; any environmental problem there is reported, not fatal.
    continue-on-error: ${{ matrix.soft }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: music, arch: x86_64, runner: windows-latest,  soft: false }
          - { profile: video, arch: x86_64, runner: windows-latest,  soft: false }
          - { profile: music, arch: arm64,  runner: windows-11-arm,  soft: true }
          - { profile: video, arch: arm64,  runner: windows-11-arm,  soft: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: "libmmpv-${{ matrix.profile }}-win-${{ matrix.arch }}", path: pkg }
      - uses: actions/download-artifact@v4
        with: { name: "smoke-${{ matrix.profile }}-win-${{ matrix.arch }}", path: smoke }
      - uses: actions/download-artifact@v4
        with: { name: testmedia, path: media }
      - name: Unpack
        shell: pwsh
        run: |
          Expand-Archive pkg/libmmpv-${{ matrix.profile }}-win-${{ matrix.arch }}.zip -DestinationPath dist
          Copy-Item smoke/mmpv_smoke.exe dist/${{ matrix.profile }}-win-${{ matrix.arch }}/bin/
          Get-ChildItem dist/${{ matrix.profile }}-win-${{ matrix.arch }}/bin | Format-Table Name, Length
          systeminfo | Select-String "OS Name","System Type"
      - name: Probe (load DLL, mpv_create, mpv_initialize)
        shell: bash
        run: |
          cd dist/${{ matrix.profile }}-win-${{ matrix.arch }}/bin && ./mmpv_smoke.exe --probe
      - name: Diagnose load failure
        if: failure()
        shell: pwsh
        run: |
          $d = "dist/${{ matrix.profile }}-win-${{ matrix.arch }}/bin"
          Push-Location $d
          & .\mmpv_smoke.exe --probe; "pwsh exit code: $LASTEXITCODE (0xC0000135 = DLL not found: $([Convert]::ToString($LASTEXITCODE,16)))"
          Pop-Location
          foreach ($n in "ole32","USER32","AVRT","ntdll","api-ms-win-core-path-l1-1-0","KERNEL32","SHELL32","ADVAPI32","api-ms-win-crt-stdio-l1-1-0","api-ms-win-crt-runtime-l1-1-0","api-ms-win-crt-filesystem-l1-1-0","api-ms-win-crt-heap-l1-1-0","api-ms-win-crt-string-l1-1-0","api-ms-win-crt-math-l1-1-0","api-ms-win-crt-time-l1-1-0","api-ms-win-crt-locale-l1-1-0","api-ms-win-crt-convert-l1-1-0","api-ms-win-crt-utility-l1-1-0","api-ms-win-crt-environment-l1-1-0","ucrtbase","msvcrt","bcrypt","ws2_32") {
            "{0,-36} {1}" -f $n, (Test-Path "$env:windir\System32\$n.dll")
          }
          Get-Content dist/${{ matrix.profile }}-win-${{ matrix.arch }}/SIZES.md | Select-String "DLL Name"
      - name: Decode tests
        shell: bash
        run: |
          D="dist/${{ matrix.profile }}-win-${{ matrix.arch }}"
          EXP=""
          if [ "${{ matrix.profile }}" = video ] && [ "${{ inputs.hwdec || '1' }}" = 1 ]; then
            EXP="d3d11va-copy dxva2-copy"; [ "${{ matrix.arch }}" = x86_64 ] && EXP="$EXP nvdec-copy"
          fi
          EXPECT_HWDEC="$EXP" SMOKE_BIN="$PWD/$D/bin/mmpv_smoke.exe" MEDIA_DIR="$PWD/media" common/tests/run_smoke.sh ${{ matrix.profile }} "$D"
